<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WUA Cafeteria Express</title><style>
:root{font:16px system-ui;color:#20302b;background:#f4f7f5}body{margin:0}header{background:#164e3b;color:white;padding:1.3rem max(5vw,20px)}main{max-width:1050px;margin:2rem auto;padding:0 20px}.panel{background:white;border-radius:14px;padding:1.2rem;margin:1rem 0;box-shadow:0 4px 18px #163d2d12}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}select,input,button{padding:.7rem;border:1px solid #b9c9c2;border-radius:8px;font:inherit}button{background:#176447;color:white;border:0;cursor:pointer}button:hover{background:#104b34}.items{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.item{border:1px solid #dce7e1;border-radius:10px;padding:1rem}.price{font-weight:700;color:#176447}.muted{color:#65756e}.notice{padding:.6rem 0}#status{font-weight:600}</style></head><body><header><h1>WUA Cafeteria Express</h1><div>Campus meals, convenient ordering, clear order updates</div></header><main><section class="panel"><h2>Browse cafeteria menus</h2><div class="row"><label for="cafeteria">Cafeteria</label><select id="cafeteria"></select><button id="refresh">Load menu</button></div><div id="menu" class="items" style="margin-top:1rem"></div></section><section class="panel"><h2>Your basket</h2><div id="basket" class="muted">Choose a menu item to start.</div><div class="row"><label for="student">Student or staff ID</label><input id="student" placeholder="e.g. WUA12345"><button id="place">Place order</button></div><p class="muted">Prototype checkout records an order only. No payment is taken.</p><div id="message" class="notice" role="status"></div></section><section class="panel"><h2>Track an order</h2><div class="row"><input id="trackId" placeholder="Order ID"><button id="track">Check status</button></div><p id="status" class="notice"></p></section></main><script src="/app.js"></script></body></html>
